<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 680" width="440" height="680" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1L9,5L0,9z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Source pill -->
  <rect x="120" y="8" width="200" height="34" rx="17" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="220" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Source (.axis)</text>

  <!-- Arrow 1 -->
  <line x1="220" y1="42" x2="220" y2="56" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Category label: Frontend -->
  <text x="28" y="82" font-size="11" font-weight="bold" fill="#2563EB" transform="rotate(-90,28,82)">Frontend</text>
  <line x1="38" y1="56" x2="38" y2="178" stroke="#2563EB" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Box 1: Lexer -->
  <rect x="80" y="56" width="280" height="50" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="96" y="77" font-size="13" font-weight="bold" fill="#1E40AF">Lexer</text>
  <text x="96" y="96" font-size="10" fill="#374151">lexer.c — Source → Token stream</text>

  <!-- Arrow 2 -->
  <line x1="220" y1="106" x2="220" y2="118" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Box 2: Parser -->
  <rect x="80" y="118" width="280" height="50" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="96" y="139" font-size="13" font-weight="bold" fill="#1E40AF">Parser</text>
  <text x="96" y="158" font-size="10" fill="#374151">parser.c — Tokens → AST</text>

  <!-- Arrow 3 -->
  <line x1="220" y1="168" x2="220" y2="182" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Category label: Middle-end -->
  <text x="28" y="210" font-size="11" font-weight="bold" fill="#059669" transform="rotate(-90,28,210)">Middle-end</text>
  <line x1="38" y1="182" x2="38" y2="300" stroke="#059669" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Box 3: Semantic Analyzer -->
  <rect x="80" y="182" width="280" height="50" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="96" y="203" font-size="13" font-weight="bold" fill="#065F46">Semantic Analyzer</text>
  <text x="96" y="222" font-size="10" fill="#374151">semantic.c — Type checking, scope analysis</text>

  <!-- Arrow 4 -->
  <line x1="220" y1="232" x2="220" y2="244" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Box 4: IR Generator -->
  <rect x="80" y="244" width="280" height="50" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="96" y="265" font-size="13" font-weight="bold" fill="#065F46">IR Generator</text>
  <text x="96" y="284" font-size="10" fill="#374151">irgen.c — AST → Three-address IR</text>

  <!-- Arrow 5 -->
  <line x1="220" y1="294" x2="220" y2="308" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Category label: Optimizer -->
  <text x="28" y="345" font-size="11" font-weight="bold" fill="#D97706" transform="rotate(-90,28,345)">Optimizer</text>
  <line x1="38" y1="308" x2="38" y2="488" stroke="#D97706" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Box 5: SSA Builder -->
  <rect x="80" y="308" width="280" height="50" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="96" y="329" font-size="13" font-weight="bold" fill="#92400E">SSA Builder</text>
  <text x="96" y="348" font-size="10" fill="#374151">ssa.c — Dominators, φ-functions</text>

  <!-- Arrow 6 -->
  <line x1="220" y1="358" x2="220" y2="370" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Box 6: SSA Optimizer -->
  <rect x="80" y="370" width="280" height="50" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="96" y="391" font-size="13" font-weight="bold" fill="#92400E">SSA Optimizer</text>
  <text x="96" y="410" font-size="10" fill="#374151">ssa_opt.c — SCCP, GVN, ADCE, LICM</text>

  <!-- Arrow 7 -->
  <line x1="220" y1="420" x2="220" y2="432" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Box 7: Optimizer -->
  <rect x="80" y="432" width="280" height="50" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="96" y="453" font-size="13" font-weight="bold" fill="#92400E">Optimizer</text>
  <text x="96" y="472" font-size="10" fill="#374151">opt.c — Pre-RA optimization pipeline</text>

  <!-- Arrow 8 -->
  <line x1="220" y1="482" x2="220" y2="496" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Category label: Backend -->
  <text x="28" y="526" font-size="11" font-weight="bold" fill="#DC2626" transform="rotate(-90,28,526)">Backend</text>
  <line x1="38" y1="496" x2="38" y2="612" stroke="#DC2626" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Box 8: x64 Code Generator -->
  <rect x="80" y="496" width="280" height="50" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="96" y="517" font-size="13" font-weight="bold" fill="#991B1B">x64 Code Generator</text>
  <text x="96" y="536" font-size="10" fill="#374151">x64.c — IR → x86-64 machine code</text>

  <!-- Arrow 9 -->
  <line x1="220" y1="546" x2="220" y2="558" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Box 9: PE / ELF Writer -->
  <rect x="80" y="558" width="280" height="50" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="96" y="579" font-size="13" font-weight="bold" fill="#991B1B">PE / ELF Writer</text>
  <text x="96" y="598" font-size="10" fill="#374151">pe.c / elf.c — Machine code → Binary</text>

  <!-- Arrow 10 -->
  <line x1="220" y1="608" x2="220" y2="624" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Executable pill -->
  <rect x="120" y="624" width="200" height="34" rx="17" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="220" y="646" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">Executable (PE / ELF)</text>
</svg>