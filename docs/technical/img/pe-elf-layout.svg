<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1L9,5L0,9z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- PE32+ column title -->
  <text x="162" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563EB">PE32+ (Windows)</text>

  <!-- PE outer frame -->
  <rect x="42" y="36" width="240" height="370" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>

  <!-- PE sections stacked -->
  <rect x="58" y="48" width="208" height="32" rx="4" fill="white" stroke="#93C5FD" stroke-width="1"/>
  <text x="162" y="69" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">DOS Header (stub)</text>

  <rect x="58" y="88" width="208" height="32" rx="4" fill="white" stroke="#93C5FD" stroke-width="1"/>
  <text x="162" y="109" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">PE Signature + COFF</text>

  <rect x="58" y="128" width="208" height="32" rx="4" fill="white" stroke="#93C5FD" stroke-width="1"/>
  <text x="162" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">Optional Header PE32+</text>

  <rect x="58" y="168" width="208" height="32" rx="4" fill="white" stroke="#93C5FD" stroke-width="1"/>
  <text x="162" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">Section Headers</text>

  <!-- Dashed separator -->
  <line x1="58" y1="212" x2="266" y2="212" stroke="#93C5FD" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- PE data sections -->
  <rect x="58" y="222" width="208" height="28" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="162" y="241" text-anchor="middle" font-size="11" fill="#1E40AF">.text (code, execute/read)</text>

  <rect x="58" y="256" width="208" height="28" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="162" y="275" text-anchor="middle" font-size="11" fill="#1E40AF">.rdata (strings, read-only)</text>

  <rect x="58" y="290" width="208" height="28" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="162" y="309" text-anchor="middle" font-size="11" fill="#1E40AF">.idata (imports)</text>

  <rect x="58" y="324" width="208" height="28" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="162" y="343" text-anchor="middle" font-size="11" fill="#1E40AF">.data (writable data)</text>

  <!-- PE info -->
  <text x="162" y="374" text-anchor="middle" font-size="11" fill="#374151">Image base: 0x400000</text>
  <text x="162" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">~3 KB typical</text>

  <!-- ELF64 column title -->
  <text x="478" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#059669">ELF64 (Linux)</text>

  <!-- ELF outer frame -->
  <rect x="358" y="36" width="240" height="370" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>

  <!-- ELF sections stacked -->
  <rect x="374" y="48" width="208" height="32" rx="4" fill="white" stroke="#6EE7B7" stroke-width="1"/>
  <text x="478" y="69" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">ELF64 Header</text>

  <rect x="374" y="88" width="208" height="32" rx="4" fill="white" stroke="#6EE7B7" stroke-width="1"/>
  <text x="478" y="109" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">Program Headers (2×PT_LOAD)</text>

  <!-- Dashed separator -->
  <line x1="374" y1="132" x2="582" y2="132" stroke="#6EE7B7" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- ELF segments -->
  <rect x="374" y="142" width="208" height="60" rx="4" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="478" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">Segment 1</text>
  <text x="478" y="180" text-anchor="middle" font-size="10" fill="#374151">.text + stubs (read + execute)</text>

  <rect x="374" y="210" width="208" height="60" rx="4" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="478" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">Segment 2</text>
  <text x="478" y="248" text-anchor="middle" font-size="10" fill="#374151">.data (read + write)</text>

  <!-- ELF info -->
  <text x="478" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">Direct syscalls — no libc</text>

  <rect x="390" y="310" width="176" height="52" rx="4" fill="white" stroke="#6EE7B7" stroke-width="1"/>
  <text x="478" y="330" text-anchor="middle" font-size="10" fill="#374151">write(1) · read(0) · exit(60) · brk(12)</text>
  <text x="478" y="348" text-anchor="middle" font-size="10" fill="#374151">Entry: _start → main → sys_exit</text>

  <text x="478" y="380" text-anchor="middle" font-size="11" fill="#374151">Load address: 0x400000</text>
  <text x="478" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">~2 KB typical</text>

  <!-- VS label -->
  <text x="320" y="226" text-anchor="middle" font-size="20" font-weight="bold" fill="#9CA3AF">vs</text>
</svg>