<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="600" height="100" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="600" height="100" rx="8" fill="#0F111A"/>
  <rect x="0.5" y="0.5" width="599" height="99" rx="8" fill="none" stroke="#1E2235" stroke-width="1"/>

  <!-- Card 1: Script Mode -->
  <rect x="12" y="12" width="180" height="76" rx="6" fill="#131825"/>
  <rect x="12" y="12" width="4" height="76" rx="2" fill="#059669"/>
  <text x="28" y="34" fill="#E5E7EB" font-size="13" font-weight="600">Script Mode</text>
  <text x="28" y="52" fill="#6B7280" font-size="11" font-family="'Cascadia Code', 'Consolas', monospace">axis hello.axis</text>
  <text x="28" y="72" fill="#4B5563" font-size="11">Compile + run instantly</text>

  <!-- Card 2: Compile Mode -->
  <rect x="204" y="12" width="192" height="76" rx="6" fill="#131825"/>
  <rect x="204" y="12" width="4" height="76" rx="2" fill="#2563EB"/>
  <text x="220" y="34" fill="#E5E7EB" font-size="13" font-weight="600">Compile Mode</text>
  <text x="220" y="52" fill="#6B7280" font-size="11" font-family="'Cascadia Code', 'Consolas', monospace">axis hello.axis -o hello</text>
  <text x="220" y="72" fill="#4B5563" font-size="11">PE32+ / ELF64 binary</text>

  <!-- Card 3: Check Mode -->
  <rect x="408" y="12" width="180" height="76" rx="6" fill="#131825"/>
  <rect x="408" y="12" width="4" height="76" rx="2" fill="#D97706"/>
  <text x="424" y="34" fill="#E5E7EB" font-size="13" font-weight="600">Check Mode</text>
  <text x="424" y="52" fill="#6B7280" font-size="11" font-family="'Cascadia Code', 'Consolas', monospace">axis check hello.axis</text>
  <text x="424" y="72" fill="#4B5563" font-size="11">Validate without running</text>
</svg>