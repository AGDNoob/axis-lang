<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" width="560" height="350" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6Z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Start -->
  <rect x="195" y="10" width="170" height="34" rx="17" fill="#2563EB" stroke="none"/>
  <text x="280" y="32" text-anchor="middle" fill="white" font-size="13" font-weight="bold">axcc program.axis</text>

  <line x1="280" y1="44" x2="280" y2="66" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Diamond: Cache fresh? -->
  <polygon points="280,70 375,110 280,150 185,110" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="280" y="107" text-anchor="middle" fill="#92400E" font-size="11">Cache exists</text>
  <text x="280" y="120" text-anchor="middle" fill="#92400E" font-size="11">&amp; unchanged?</text>

  <!-- Yes path → Execute cached -->
  <line x1="375" y1="110" x2="455" y2="110" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="415" y="103" text-anchor="middle" fill="#059669" font-size="11" font-weight="bold">yes</text>

  <rect x="460" y="93" width="85" height="34" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="502" y="115" text-anchor="middle" fill="#065F46" font-size="12" font-weight="bold">Execute</text>

  <text x="502" y="148" text-anchor="middle" fill="#059669" font-size="10" font-style="italic">Fast path</text>
  <text x="502" y="161" text-anchor="middle" fill="#059669" font-size="10" font-style="italic">(~0 ms overhead)</text>

  <!-- No path → Compile -->
  <line x1="280" y1="150" x2="280" y2="172" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="295" y="167" fill="#DC2626" font-size="11" font-weight="bold">no</text>

  <rect x="210" y="176" width="140" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="280" y="198" text-anchor="middle" fill="#1E40AF" font-size="12" font-weight="bold">Compile to native</text>

  <line x1="280" y1="210" x2="280" y2="232" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="195" y="236" width="170" height="34" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="280" y="258" text-anchor="middle" fill="#92400E" font-size="12" font-weight="bold">Store in __axcache__/</text>

  <line x1="280" y1="270" x2="280" y2="292" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="240" y="296" width="80" height="34" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="280" y="318" text-anchor="middle" fill="#065F46" font-size="12" font-weight="bold">Execute</text>

  <!-- Side labels -->
  <text x="100" y="240" text-anchor="middle" fill="#6B7280" font-size="10" font-style="italic">First run or</text>
  <text x="100" y="253" text-anchor="middle" fill="#6B7280" font-size="10" font-style="italic">source changed</text>
</svg>
