<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" width="700" height="210" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1L9,5L0,9z" fill="#9CA3AF"/>
    </marker>
    <clipPath id="c1"><rect x="16" y="78" width="152" height="104" rx="8"/></clipPath>
    <clipPath id="c2"><rect x="186" y="78" width="152" height="104" rx="8"/></clipPath>
    <clipPath id="c3"><rect x="356" y="78" width="152" height="104" rx="8"/></clipPath>
    <clipPath id="c4"><rect x="531" y="78" width="152" height="104" rx="8"/></clipPath>
  </defs>

  <!-- Entry box -->
  <rect x="225" y="8" width="250" height="40" rx="8" fill="#F9FAFB" stroke="#374151" stroke-width="1.5"/>
  <text x="350" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">axis &#x2039;file&#x203A; [flags]</text>

  <!-- Connector: down from entry, horizontal bar, drops to cards -->
  <line x1="350" y1="48" x2="350" y2="58" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="92" y1="58" x2="607" y2="58" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="92"  y1="58" x2="92"  y2="78" stroke="#9CA3AF" stroke-width="1" marker-end="url(#a)"/>
  <line x1="262" y1="58" x2="262" y2="78" stroke="#9CA3AF" stroke-width="1" marker-end="url(#a)"/>
  <line x1="432" y1="58" x2="432" y2="78" stroke="#9CA3AF" stroke-width="1" marker-end="url(#a)"/>
  <line x1="607" y1="58" x2="607" y2="78" stroke="#9CA3AF" stroke-width="1" marker-end="url(#a)"/>

  <!-- Card 1: run -->
  <rect x="16" y="78" width="152" height="104" rx="8" fill="#ECFDF5" clip-path="url(#c1)"/>
  <rect x="16" y="78" width="152" height="28" fill="#059669" clip-path="url(#c1)"/>
  <rect x="16" y="78" width="152" height="104" rx="8" fill="none" stroke="#059669" stroke-width="1.5"/>
  <text x="92" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="white">run</text>
  <text x="92" y="122" text-anchor="middle" font-size="11" fill="#065F46">Script mode only</text>
  <text x="92" y="138" text-anchor="middle" font-size="11" fill="#065F46">Cache + execute</text>
  <text x="92" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">&#x2192; runs program</text>

  <!-- Card 2: build -->
  <rect x="186" y="78" width="152" height="104" rx="8" fill="#EFF6FF" clip-path="url(#c2)"/>
  <rect x="186" y="78" width="152" height="28" fill="#2563EB" clip-path="url(#c2)"/>
  <rect x="186" y="78" width="152" height="104" rx="8" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="262" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="white">build</text>
  <text x="262" y="122" text-anchor="middle" font-size="11" fill="#1E40AF">Compile mode only</text>
  <text x="262" y="138" text-anchor="middle" font-size="11" fill="#1E40AF">Output via -o or auto</text>
  <text x="262" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">&#x2192; PE / ELF binary</text>

  <!-- Card 3: check -->
  <rect x="356" y="78" width="152" height="104" rx="8" fill="#FFFBEB" clip-path="url(#c3)"/>
  <rect x="356" y="78" width="152" height="28" fill="#D97706" clip-path="url(#c3)"/>
  <rect x="356" y="78" width="152" height="104" rx="8" fill="none" stroke="#D97706" stroke-width="1.5"/>
  <text x="432" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="white">check</text>
  <text x="432" y="122" text-anchor="middle" font-size="11" fill="#92400E">Any mode</text>
  <text x="432" y="138" text-anchor="middle" font-size="11" fill="#92400E">No code generated</text>
  <text x="432" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97706">&#x2192; error report</text>

  <!-- Card 4: auto-detect -->
  <rect x="531" y="78" width="152" height="104" rx="8" fill="#F5F3FF" clip-path="url(#c4)"/>
  <rect x="531" y="78" width="152" height="28" fill="#7C3AED" clip-path="url(#c4)"/>
  <rect x="531" y="78" width="152" height="104" rx="8" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="607" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="white">(no cmd)</text>
  <text x="607" y="122" text-anchor="middle" font-size="11" fill="#5B21B6">Peek mode header</text>
  <text x="607" y="146" text-anchor="middle" font-size="11" fill="#5B21B6">script &#x2192; like run</text>
  <text x="607" y="164" text-anchor="middle" font-size="11" fill="#5B21B6">compile &#x2192; like build</text>

  <!-- Footnote -->
  <text x="350" y="202" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">--pe / --elf only apply to build and auto-detect compile mode</text>
</svg>
