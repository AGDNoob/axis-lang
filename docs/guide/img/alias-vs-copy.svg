<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" width="620" height="240" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6Z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Left panel: Alias -->
  <rect x="10" y="10" width="290" height="220" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <rect x="10" y="10" width="290" height="36" rx="8" fill="#059669"/>
  <rect x="10" y="30" width="290" height="16" fill="#059669"/>
  <text x="155" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Alias: y = x</text>

  <rect x="35" y="75" width="90" height="34" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="80" y="97" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold">x : i32</text>

  <rect x="35" y="145" width="90" height="34" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="80" y="167" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold">y : i32</text>

  <rect x="195" y="100" width="80" height="42" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <text x="235" y="126" text-anchor="middle" fill="#065F46" font-size="15" font-weight="bold">42</text>

  <line x1="125" y1="92" x2="190" y2="115" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="125" y1="162" x2="190" y2="128" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="155" y="212" text-anchor="middle" fill="#374151" font-size="11">Shared — changes to x affect y</text>

  <!-- Right panel: Copy -->
  <rect x="320" y="10" width="290" height="220" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <rect x="320" y="10" width="290" height="36" rx="8" fill="#2563EB"/>
  <rect x="320" y="30" width="290" height="16" fill="#2563EB"/>
  <text x="465" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Copy: z = copy x</text>

  <rect x="345" y="75" width="90" height="34" rx="6" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="390" y="97" text-anchor="middle" fill="#1E40AF" font-size="13" font-weight="bold">x : i32</text>

  <rect x="345" y="145" width="90" height="34" rx="6" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="390" y="167" text-anchor="middle" fill="#1E40AF" font-size="13" font-weight="bold">z : i32</text>

  <rect x="500" y="75" width="80" height="34" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="540" y="97" text-anchor="middle" fill="#1E40AF" font-size="15" font-weight="bold">42</text>

  <rect x="500" y="145" width="80" height="34" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="540" y="167" text-anchor="middle" fill="#1E40AF" font-size="15" font-weight="bold">42</text>

  <line x1="435" y1="92" x2="495" y2="92" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="435" y1="162" x2="495" y2="162" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="465" y="212" text-anchor="middle" fill="#374151" font-size="11">Independent — changes to x don't affect z</text>
</svg>
