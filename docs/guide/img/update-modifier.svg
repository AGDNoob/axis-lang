<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6Z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Left panel: Normal (copy) -->
  <rect x="10" y="10" width="290" height="240" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <rect x="10" y="10" width="290" height="36" rx="8" fill="#DC2626"/>
  <rect x="10" y="30" width="290" height="16" fill="#DC2626"/>
  <text x="155" y="34" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Normal: func f(x: i32)</text>

  <text x="65" y="72" text-anchor="middle" fill="#374151" font-size="11" font-weight="bold">Caller</text>
  <rect x="30" y="80" width="70" height="34" rx="6" fill="white" stroke="#DC2626" stroke-width="1.5"/>
  <text x="65" y="102" text-anchor="middle" fill="#991B1B" font-size="13" font-weight="bold">val = 5</text>

  <line x1="100" y1="97" x2="155" y2="97" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#a)"/>
  <text x="128" y="90" text-anchor="middle" fill="#6B7280" font-size="10">copy</text>

  <text x="215" y="72" text-anchor="middle" fill="#374151" font-size="11" font-weight="bold">Function</text>
  <rect x="160" y="80" width="110" height="34" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="215" y="102" text-anchor="middle" fill="#991B1B" font-size="12">x = 5 → x = 10</text>

  <text x="155" y="148" text-anchor="middle" fill="#374151" font-size="12" font-weight="bold">After call:</text>
  <rect x="90" y="158" width="130" height="34" rx="6" fill="white" stroke="#DC2626" stroke-width="2"/>
  <text x="155" y="180" text-anchor="middle" fill="#991B1B" font-size="13" font-weight="bold">val = 5 ✗</text>

  <text x="155" y="222" text-anchor="middle" fill="#374151" font-size="11">Original unchanged</text>

  <!-- Right panel: update (reference) -->
  <rect x="320" y="10" width="290" height="240" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <rect x="320" y="10" width="290" height="36" rx="8" fill="#059669"/>
  <rect x="320" y="30" width="290" height="16" fill="#059669"/>
  <text x="465" y="34" text-anchor="middle" fill="white" font-size="13" font-weight="bold">update: func f(update x: i32)</text>

  <text x="375" y="72" text-anchor="middle" fill="#374151" font-size="11" font-weight="bold">Caller</text>
  <rect x="340" y="80" width="70" height="34" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="375" y="102" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold">val = 5</text>

  <line x1="410" y1="97" x2="465" y2="97" stroke="#059669" stroke-width="2" marker-end="url(#a)"/>
  <text x="438" y="90" text-anchor="middle" fill="#059669" font-size="10" font-weight="bold">ref</text>

  <text x="535" y="72" text-anchor="middle" fill="#374151" font-size="11" font-weight="bold">Function</text>
  <rect x="470" y="80" width="110" height="34" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="525" y="102" text-anchor="middle" fill="#065F46" font-size="12">x = x * 2</text>

  <text x="465" y="148" text-anchor="middle" fill="#374151" font-size="12" font-weight="bold">After call:</text>
  <rect x="400" y="158" width="130" height="34" rx="6" fill="white" stroke="#059669" stroke-width="2"/>
  <text x="465" y="180" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold">val = 10 ✓</text>

  <text x="465" y="222" text-anchor="middle" fill="#374151" font-size="11">Caller's variable modified</text>
</svg>
